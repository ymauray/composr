name: Release

# Publie la version déclarée dans package.json : à chaque push sur main,
# crée le tag vX.Y.Z et sa release s'ils n'existent pas encore.
# Publier une version revient donc à incrémenter `version` dans package.json.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publier la version de package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version invalide dans package.json : $version"
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag est déjà publiée."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Composr $tag" --generate-notes
